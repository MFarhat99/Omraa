<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123e32">
<meta name="description" content="رفيق العمرة: دليل تفاعلي للمناسك والأذكار خطوة بخطوة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رفيق العمرة">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%D8%B1%D9%81%D9%8A%D9%82%20%D8%A7%D9%84%D8%B9%D9%85%D8%B1%D8%A9%22%2C%22short_name%22%3A%22%D8%B1%D9%81%D9%8A%D9%82%20%D8%A7%D9%84%D8%B9%D9%85%D8%B1%D8%A9%22%2C%22display%22%3A%22standalone%22%2C%22dir%22%3A%22rtl%22%2C%22lang%22%3A%22ar%22%2C%22background_color%22%3A%22%23f7f5ef%22%2C%22theme_color%22%3A%22%23123e32%22%7D">
<title>رفيق العمرة | دليل تفاعلي</title>
<style>
:root{
  --forest:#123e32;--green:#226b51;--mint:#e8f1eb;--sand:#d8b66a;
  --paper:#f4f2ea;--card:#ffffff;--ink:#20312a;--muted:#6a7a71;--line:#dce4dc;
  --arabic:#174b39;--note:#fff7e7;--rem:#edf5ef;--chip:#eef2ed;
  --okbg:#e8f6ec;--okline:#2f8a4f;--nobg:#fdecea;--noline:#b3382c;--sunbg:#fff6dc;--sunline:#c9a24a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sar:env(safe-area-inset-right,0px);--sal:env(safe-area-inset-left,0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --paper:#0e1713;--card:#16221c;--ink:#e6efe9;--muted:#9bb0a5;--line:#263830;
    --mint:#1d3329;--arabic:#bfe3cf;--note:#2a2415;--rem:#173024;--chip:#1f3028;
    --forest:#9fd4b8;--green:#2f8a67;
    --okbg:#14301f;--okline:#3fae6a;--nobg:#3a1d1a;--noline:#e0665a;--sunbg:#2c2614;--sunline:#d8b66a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic","Geeza Pro",Roboto,Tahoma,Arial,sans-serif;
  font-size:1.0625rem;line-height:1.85;touch-action:manipulation;
  padding-bottom:calc(128px + var(--sab));
}
body.no-bar{padding-bottom:calc(24px + var(--sab))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}

/* الشريط العلوي */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,#0d3027,#226b51);color:#fff;
  padding:calc(10px + var(--sat)) calc(14px + var(--sar)) 12px calc(14px + var(--sal));
}
.top-row{display:flex;align-items:center;gap:10px}
.menu-btn{
  width:46px;height:46px;border-radius:14px;border:0;background:#ffffff22;color:#fff;
  font-size:1.35rem;display:grid;place-items:center;flex-shrink:0
}
.top-title{flex:1;min-width:0}
.top-title b{display:block;font-size:1.05rem;line-height:1.4}
.top-title span{display:block;font-size:.8rem;color:#cfe5d8;line-height:1.4}
.pct{font-weight:bold;font-size:1rem;background:#ffffff22;border-radius:12px;padding:4px 11px}
.track{height:7px;background:#ffffff30;border-radius:20px;overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#9fe0bf,var(--sand));transition:width .25s}

/* المحتوى */
.container{max-width:720px;margin:auto;padding:14px calc(14px + var(--sar)) 0 calc(14px + var(--sal))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 6px 22px #0a2a1c0d}
.stage-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.85rem}
h2{color:var(--forest);line-height:1.5;font-size:1.45rem;margin:8px 0}
h3{color:var(--forest);font-size:1.08rem;margin:24px 0 8px}
.intro{color:var(--muted);margin:6px 0}
p{margin:8px 0}
.reminder{padding:14px 15px;border-radius:14px;margin:20px 0 16px;background:var(--rem);border-right:4px solid var(--green)}
.source{font-size:.82rem;color:var(--muted);margin-top:6px}

/* فقرات المرحلة (بترتيب زمني) */
.sec{border-top:1px dashed var(--line);margin-top:20px;padding-top:4px}
.sec:first-of-type{border-top:0;margin-top:10px}
.sec-head{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
.sec-head h3{margin:0;font-size:1.12rem}
.sec-num{
  min-width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;
  display:grid;place-items:center;font-weight:bold;font-size:.95rem;flex-shrink:0
}
ol.steps{margin:8px 0;padding:0 28px 0 0}
ol.steps li{margin:7px 0}
ol.steps li::marker{color:var(--green);font-weight:bold}

/* حلال / حرام / سنة */
.box{border-radius:14px;padding:12px 14px;margin:12px 0;border-right:6px solid}
.box b{display:block;margin-bottom:4px;font-size:1.02rem}
.box ul{margin:4px 0 0;padding:0 20px 0 0}
.box li{margin:6px 0}
.box.ok{background:var(--okbg);border-color:var(--okline)}
.box.ok b{color:var(--okline)}
.box.no{background:var(--nobg);border-color:var(--noline)}
.box.no b{color:var(--noline)}
.box.sun{background:var(--sunbg);border-color:var(--sunline)}
.box.sun b{color:#a07a1c}
@media(prefers-color-scheme:dark){.box.sun b{color:var(--sunline)}}
.warn{background:var(--note);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:.95rem;border-right:4px solid var(--sand)}

/* الأدعية */
.dua{border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.dua-label{font-weight:bold;color:var(--forest)}
.arabic{
  font-family:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Scheherazade New","Segoe UI",Tahoma,serif;
  font-size:1.35rem;line-height:2.2;white-space:pre-line;margin:8px 0;color:var(--arabic)
}
.meaning{font-size:.9rem;color:var(--muted)}
.mini-btn{
  border:1px solid var(--line);background:var(--chip);color:var(--forest);
  border-radius:12px;padding:10px 16px;min-height:44px;margin-top:10px
}

/* الأسئلة */
.faqhead{font-weight:bold;color:var(--muted);font-size:.9rem;margin:16px 0 4px}
details.faq{border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card)}
details.faq summary{
  padding:13px 14px;min-height:52px;font-weight:bold;color:var(--forest);cursor:pointer;
  list-style:none;display:flex;gap:10px;align-items:center
}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:"＋";color:var(--green);font-weight:bold;flex-shrink:0}
details.faq[open] summary::before{content:"−"}
details.faq .ans{padding:0 14px 14px;color:var(--ink)}

/* العداد */
.counter{border:1px solid var(--line);border-radius:20px;padding:16px;margin:18px 0;background:var(--mint);text-align:center}
.counter strong{color:var(--forest)}
.counter-help{font-size:.83rem;color:var(--muted);margin-top:6px}
.tap{
  width:min(58vw,210px);aspect-ratio:1;border-radius:50%;border:0;margin:12px auto;
  display:grid;place-items:center;align-content:center;
  background:linear-gradient(145deg,var(--green),#164d3a);color:#fff;
  box-shadow:0 10px 26px #0a3a2a44;user-select:none;-webkit-user-select:none
}
.tap:active:not(:disabled){transform:scale(.96)}
.tap:disabled{opacity:1;background:linear-gradient(145deg,#b9953f,#d8b66a);color:#2c2108}
.tap .n{font-size:3.6rem;font-weight:bold;line-height:1}
.tap .l{font-size:.9rem;opacity:.9;margin-top:4px}
.counter-controls{display:flex;gap:10px;justify-content:center}
.counter-controls button{
  min-width:56px;min-height:48px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--forest);font-size:1.2rem;padding:0 16px
}
.counter-controls .reset{font-size:.9rem}

/* قائمة التحقق */
.check-area{margin-top:26px;padding-top:16px;border-top:2px dashed var(--line)}
.check-row{
  display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);
  background:var(--card);border-radius:14px;padding:13px;margin:10px 0;min-height:56px
}
.check-row input{width:26px;height:26px;accent-color:var(--green);margin:3px 0 0;flex-shrink:0}
.check-row.done span{text-decoration:line-through;color:var(--muted)}
.review-banner{background:var(--note);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:.92rem}

/* الشريط السفلي */
.bottombar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:var(--card);border-top:1px solid var(--line);
  padding:8px calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal));
  box-shadow:0 -6px 20px #0a2a1c14
}
body.no-bar .bottombar{display:none}
.bar-status{text-align:center;font-size:.82rem;color:var(--muted);margin-bottom:6px;line-height:1.4}
.bar-status.ok{color:var(--green);font-weight:bold}
.bar-inner{display:flex;gap:10px;max-width:720px;margin:auto}
.bar-inner button{
  min-height:52px;border:0;border-radius:15px;font-weight:bold;font-size:1.02rem
}
.btn-next{flex:2;background:var(--green);color:#fff}
.btn-prev{flex:1;background:var(--chip);color:var(--forest)}

/* لوحة المراحل */
.overlay{
  position:fixed;inset:0;background:#000a;z-index:40;display:none;
  align-items:flex-end;justify-content:center
}
.overlay.open{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:560px;max-height:84dvh;overflow:auto;
  border-radius:24px 24px 0 0;padding:16px 16px calc(18px + var(--sab));
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head b{font-size:1.15rem;color:var(--forest)}
.close-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--chip);font-size:1.2rem}
.stage-nav{display:grid;gap:6px}
.stage-nav button{
  border:1px solid transparent;border-radius:14px;padding:11px;min-height:52px;background:transparent;
  text-align:right;color:var(--ink);display:flex;align-items:center;gap:12px
}
.stage-nav button.active{background:var(--mint);border-color:var(--line);color:var(--forest);font-weight:bold}
.num{min-width:32px;height:32px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:.9rem}
.active .num{background:var(--green);color:#fff}
.sheet-actions{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sheet-actions button{
  min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--forest)
}
.sheet-actions .danger{color:#b3382c}
.size-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px}
.size-row div{display:flex;gap:8px}
.size-row button{min-width:60px}
.safety-note{font-size:.88rem;color:var(--muted);margin-top:12px}
textarea.notes{
  width:100%;min-height:42dvh;border:1px solid var(--line);border-radius:14px;padding:12px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:1.05rem;line-height:1.9;resize:vertical
}

/* شاشة الاكتمال */
.finish{text-align:center;padding:10px 2px 6px}
.finish-symbol{
  width:92px;height:92px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;
  font-size:3rem;color:#fff;background:linear-gradient(145deg,var(--green),#164d3a);
  box-shadow:0 10px 26px #0a3a2a44
}
.finish h2{font-size:1.8rem}
.blessing{
  font-family:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  font-size:1.35rem;line-height:2.2;color:var(--arabic);margin:12px 0
}
.dua-request{
  background:var(--note);border-radius:18px;padding:16px;margin:18px 0;text-align:right;
  border:1px solid var(--sand)
}
.dua-request b{color:var(--forest)}
.finish-actions{display:grid;gap:10px;margin-top:18px}
.primary-btn,.secondary-btn{min-height:54px;border-radius:15px;border:0;font-weight:bold;font-size:1.02rem}
.primary-btn{background:var(--green);color:#fff}
.secondary-btn{background:var(--chip);color:var(--forest)}
.secondary-btn.danger{color:#b3382c}

.toast{
  position:fixed;bottom:calc(130px + var(--sab));left:50%;transform:translateX(-50%);
  background:#173e31;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;
  display:none;max-width:90%;text-align:center;font-size:.95rem
}
body.no-bar .toast{bottom:calc(30px + var(--sab))}

/* نسخة PDF */
#printArea{display:none}
@media print{
  @page{size:A4;margin:16mm}
  body{background:#fff !important;color:#000 !important;padding:0 !important;font-size:12.5pt;line-height:1.9}
  .topbar,.container,.bottombar,.overlay,.toast{display:none !important}
  #printArea{display:block !important;direction:rtl}
  #printArea h1{font-size:24pt;text-align:center;margin:0 0 4pt;color:#123e32}
  #printArea .sub{text-align:center;color:#555;margin-bottom:14pt}
  #printArea .stage{margin:0 0 16pt;padding-bottom:10pt;border-bottom:1px solid #ccc}
  #printArea h2{font-size:16pt;color:#123e32;margin:0 0 4pt}
  #printArea h3{font-size:13pt;color:#123e32;margin:12pt 0 3pt;break-after:avoid}
  #printArea .pdua{border:1px solid #bbb;border-radius:8pt;padding:7pt 10pt;margin:6pt 0;break-inside:avoid}
  #printArea .pdua b{color:#123e32}
  #printArea .parabic{
    font-family:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Times New Roman",serif;
    font-size:15pt;line-height:2.1;white-space:pre-line;color:#10382a
  }
  #printArea .prem{background:#f1f6f2;padding:6pt 9pt;border-radius:6pt;margin-top:6pt;font-size:11.5pt}
  #printArea .psrc{font-size:9.5pt;color:#666}
  #printArea .pfoot{text-align:center;margin-top:16pt;padding-top:10pt;border-top:2px solid #123e32}
  #printArea ul,#printArea ol{margin:3pt 0;padding:0 18pt 0 0}
  #printArea .pwarn{background:#fbf5e6;padding:6pt 9pt;border-radius:6pt;font-size:11.5pt;margin:5pt 0}
  #printArea .pbox{border:1px solid #999;border-right:5pt solid #999;padding:5pt 9pt;margin:6pt 0;break-inside:avoid}
  #printArea .pbox.ok{border-right-color:#2f8a4f}
  #printArea .pbox.no{border-right-color:#b3382c}
  #printArea .pbox.sun{border-right-color:#c9a24a}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="top-row">
    <button class="menu-btn" id="menuBtn" aria-label="قائمة المراحل">☰</button>
    <div class="top-title">
      <b>رفيق العمرة</b>
      <span id="progressText">أنجزت 0 من 8 مراحل</span>
    </div>
    <span class="pct" id="progressPct">0%</span>
  </div>
  <div class="track"><div class="fill" id="progressFill"></div></div>
</header>

<div class="container">
  <main id="content" class="card" aria-live="polite"></main>
</div>

<div class="bottombar" id="bottomBar">
  <div class="bar-status" id="barStatus"></div>
  <div class="bar-inner">
    <button type="button" class="btn-prev" id="prev">← السابقة</button>
    <button type="button" class="btn-next" id="next" disabled>التالي ←</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-label="مراحل العمرة">
    <div class="sheet-head">
      <b>مراحل العمرة</b>
      <button class="close-btn" id="closeSheet" aria-label="إغلاق">✕</button>
    </div>
    <nav class="stage-nav" id="stageNav"></nav>
    <div class="sheet-actions">
      <div class="size-row">
        <span>حجم الخط</span>
        <div>
          <button type="button" id="fontMinus" aria-label="تصغير الخط">أ−</button>
          <button type="button" id="fontPlus" aria-label="تكبير الخط">أ+</button>
        </div>
      </div>
      <button type="button" id="notesBtn">📝 دفتر أدعيتي</button>
      <button type="button" id="pdfBtn">📄 حفظ الدليل PDF</button>
      <button type="button" class="danger" id="resetAll">إعادة ضبط كل شيء</button>
    </div>
    <p class="safety-note">الرفق بالناس وتجنب المزاحمة من حسن أداء النسك. اتبع تعليمات الجهات المنظمة للحرم.</p>
  </div>
</div>

<div class="overlay" id="notesOverlay">
  <div class="sheet" role="dialog" aria-label="دفتر أدعيتي">
    <div class="sheet-head">
      <b>📝 دفتر أدعيتي</b>
      <button class="close-btn" id="closeNotes" aria-label="إغلاق">✕</button>
    </div>
    <p class="safety-note" style="margin-top:0">اكتب أدعيتك وحاجاتك. تُحفظ تلقائيًا على جهازك فقط.</p>
    <textarea class="notes" id="notesText" placeholder="اكتب هنا..."></textarea>
    <div class="sheet-actions">
      <button type="button" id="copyNotes">نسخ النص</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="printArea" aria-hidden="true"></div>

<script>
"use strict";

const STORAGE = {
  done: "umrah_done_v2",
  counts: "umrah_counts_v2",
  checkPrefix: "umrah_check_v2_",
  cur: "umrah_cur_v2",
  notes: "umrah_notes_v2",
  scale: "umrah_scale_v2"
};

/*
  بنية المرحلة: عنوان + مقدمة + فقرات (sections) مرتبة زمنيًا.
  كل فقرة: p (شرح)، steps (خطوات مرقمة)، duas (أدعية)،
  boxes (kind: ok = حلال، no = حرام، sun = سنة)، note، faq (أسئلة هذه الخطوة فقط).
*/
const stages = [
{
title:"1. الاستعداد قبل العمرة",
intro:"هذه مرحلة تجهيز قبل أن تبدأ المناسك. خذ وقتك فيها حتى تدخل العمرة وأنت فاهم ما ستفعله وفي أي ترتيب.",
sections:[
{
title:"النية والتوبة (قبل السفر)",
p:[
"اجعل نيتك خالصة لله وحده، لا للتصوير ولا للتفاخر أمام الناس.",
"تُب من ذنوبك. وإن كان عليك حقوق للناس فردّها قدر استطاعتك، واطلب السماح ممن ظلمته، ورتّب ديونك وأماناتك قبل أن تسافر."
]
},
{
title:"افهم ترتيب المناسك",
p:["العمرة خمس خطوات متتابعة. لا تقدّم خطوة على خطوة:"],
steps:[
"الإحرام: النية والتلبية عند الميقات.",
"الطواف: سبعة أشواط حول الكعبة.",
"ركعتان بعد الطواف، ثم شرب ماء زمزم.",
"السعي: سبعة أشواط بين الصفا والمروة.",
"الحلق أو التقصير، وبه تنتهي العمرة."
],
faq:[
{q:"هل أحتاج إلى مرشد؟",a:"لا يلزم، لكن وجود مرشد أو رفيق يعرف المناسك يفيدك كثيرًا، خصوصًا في أول عمرة. وهذا الدليل يساعدك، لكنه لا يغني عن سؤال أهل العلم في الحالات الخاصة."}
]
},
{
title:"اعرف ميقاتك",
p:[
"الميقات مكان محدد، لا يجوز لمن أراد العمرة أن يتجاوزه دون إحرام. يختلف الميقات حسب الجهة التي تأتي منها.",
"اسأل شركة السفر أو المرشد عن ميقاتك قبل السفر. وإن كنت مسافرًا بالطائرة فاعرف متى ستمر بالميقات في الجو."
]
},
{
title:"جهّز ما تحتاجه",
p:["احمل معك:"],
steps:[
"ثياب الإحرام: للرجل إزار ورداء (الأبيض أفضل وليس شرطًا). والمرأة تلبس لباسها الساتر المعتاد بأي لون.",
"للرجل: حذاء مفتوح أو نعل مريح لا يغطي الكعبين.",
"جواز السفر والأوراق وحجز الإقامة.",
"أدويتك الخاصة، وماء، وصابون ومعجون أسنان غير معطرين.",
"هذا الدليل على هاتفك مع شاحن أو بطارية احتياطية."
]
}
],
reminder:"قال الله تعالى: «وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَى» (البقرة: 197).",
source:"القرآن الكريم: سورة البقرة، الآية 197.",
checks:[
"أخلص النية لله وأستحضر أن العمرة عبادة.",
"أتعرف على الميقات الذي سأمر به وأستعد قبل الوصول إليه.",
"أجهز احتياجات السفر وأتعلم ترتيب المناسك.",
"أراجع أحكام الإحرام الخاصة بالرجل أو المرأة."
]
},
{
title:"2. الميقات والإحرام",
intro:"الإحرام هو نية الدخول في العمرة. من لحظة النية تصير «محرِمًا»، فيحرم عليك أشياء كانت حلالًا قبلها. وتنتهي هذه الأحكام بالحلق أو التقصير. اقرأ الفقرات بالترتيب فهي مرتبة زمنيًا.",
sections:[
{
title:"التهيؤ قبل الميقات",
p:["قبل أن تصل إلى الميقات جهّز نفسك. كل هذا يجوز في بيتك أو فندقك أو قبل ركوب الطائرة، لأنك لم تنوِ الإحرام بعد."],
steps:[
"قص أظافرك وأزل شعر الإبط والعانة إن احتجت. افعل هذا الآن، لأنه سيحرم عليك بعد النية.",
"اغتسل كغسل الجنابة (سنة)، أو على الأقل تنظف جيدًا.",
"الرجل يلبس إزارًا ورداءً. والمرأة تلبس لباسها الساتر المعتاد دون لون معين.",
"إن حضرت صلاة فريضة فصلّها ثم أحرم بعدها. ولا توجد صلاة مخصوصة للإحرام."
],
boxes:[
{kind:"ok",title:"حلال لك قبل النية",items:[
"التطيب في بدنك قبل نية الإحرام، ولو بقيت رائحته بعدها. أما الثوب فالأحوط ألا تطيبه.",
"لبس ثياب الإحرام مبكرًا قبل الميقات، ما دمت لم تنوِ النسك بعد.",
"الاغتسال بالصابون العادي."
]}
]
},
{
title:"الميقات: أين ومتى تنوي",
p:[
"تنوي الإحرام عند الميقات أو قبل أن تتجاوزه بقليل، وليس بعده.",
"إن كنت في الطائرة فانتظر إعلان الطاقم عن قرب الميقات أو راقب خريطة الرحلة."
],
boxes:[
{kind:"ok",title:"حلال",items:[
"أن تلبس لباس الإحرام قبل الميقات وتؤخر النية إلى الميقات (وهذا الأفضل).",
"أن تنوي قبل الميقات بقليل احتياطًا، خصوصًا في الطائرة."
]},
{kind:"no",title:"حرام",items:[
"أن تتجاوز الميقات وأنت تريد العمرة دون إحرام."
]}
],
faq:[
{q:"أنا في الطائرة: متى أحرم؟",a:"تهيأ في بيتك أو المطار (اغتسال ولباس الإحرام). ثم انوِ العمرة عند محاذاة الميقات في الجو، وغالبًا يعلن الطاقم عنه. والأحوط أن تنوي قبله بقليل. لا تؤخر النية إلى الهبوط في جدة."},
{q:"نسيت الإحرام وتجاوزت الميقات",a:"ارجع إلى الميقات وأحرم منه إن أمكن. وإن لم تتمكن فاسأل مرشدًا فورًا؛ فعند جمهور الفقهاء تلزمه فدية (ذبح شاة توزع على فقراء الحرم)."}
]
},
{
title:"النية والتلبية",
p:["الترتيب هنا مهم: أولًا النية، ثم إعلان العمرة، ثم التلبية."],
steps:[
"انوِ العمرة بقلبك، فالنية محلها القلب.",
"قل: «لبيك اللهم عمرة». هذا إعلان دخولك في النسك، وتقوله مرة واحدة.",
"ثم ابدأ التلبية «لبيك اللهم لبيك...» وكررها كثيرًا.",
"الرجل يرفع صوته بالتلبية، والمرأة تلبي بصوت يسمعه من بجانبها فقط.",
"استمر في التلبية حتى تبدأ الطواف."
],
duas:[
{title:"أولًا: عند الدخول في العمرة",text:"لَبَّيْكَ اللَّهُمَّ عُمْرَةً.",meaning:"إعلان الدخول في النسك، ومحل النية القلب."},
{title:"ثانيًا: ثم التلبية",text:"لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ.",meaning:"التلبية الواردة في السنة. تكررها حتى تبدأ الطواف."}
],
faq:[
{q:"هل تحرم المرأة وهي حائض؟",a:"نعم، تحرم وتلبي كغيرها وتفعل كل ما يفعله المحرم، لكن لا تطوف بالبيت حتى تطهر وتغتسل. وإن ضاق وقتها وخشيت فوات سفرها فلتسأل أهل العلم عن حل يناسب حالتها."}
]
},
{
title:"ما يحرم وما يحل بعد الإحرام",
p:["من لحظة النية صرت محرِمًا. اقرأ القوائم بتمعن: ما صار حرامًا عليك، وما بقي حلالًا."],
boxes:[
{kind:"no",title:"حرام على الرجل والمرأة",items:[
"حلق الشعر أو قصه أو نتفه، من الرأس أو من أي مكان في الجسد.",
"قص الأظافر.",
"الطيب: استعمال العطر في البدن أو الثوب، فاختر صابونًا ومعجونًا غير معطرين.",
"عقد النكاح والخطبة، لنفسك أو لغيرك.",
"الجماع، والمباشرة والتقبيل بشهوة.",
"اصطياد حيوان البر أو قتله أو الإعانة على ذلك."
]},
{kind:"no",title:"حرام على الرجل فقط",items:[
"المخيط على قدر البدن، كالقميص والسروال والفانيلة.",
"تغطية الرأس بما يلامسه، كالطاقية والعمامة والغطرة.",
"لبس ما يغطي الكعبين، كالخف والجوارب والحذاء المغلق."
]},
{kind:"no",title:"حرام على المرأة فقط",items:[
"النقاب (غطاء الوجه الذي يفصَّل على الوجه).",
"القفازان في اليدين."
]},
{kind:"ok",title:"حلال لك وأنت محرم",items:[
"الاغتسال وغسل الرأس والجسد بالماء، وحك الجسد برفق.",
"تغيير ثياب الإحرام وغسلها.",
"حمل المظلة، والجلوس تحت السقف أو الخيمة أو في السيارة.",
"لبس الساعة والخاتم والنظارة والحزام والمحفظة.",
"لبس النعل أو الحذاء المفتوح الذي لا يغطي الكعبين (للرجل).",
"الأكل والشرب والنوم والكلام والضحك والتصوير.",
"قتل المؤذي كالعقرب والحية والفأر والكلب العقور.",
"المرأة: اللباس الساتر المعتاد بأي لون، مع تغطية وجهها بالخمار عند وجود الأجانب دون أن يلامس وجهها."
]}
],
note:"الجماع أعظم هذه المحظورات، ويترتب عليه أحكام تحتاج سؤال أهل العلم. وللفدية تفاصيل تختلف بحسب المحظور والعذر، فاسأل مرشدًا موثوقًا.",
faq:[
{q:"فعلت محظورًا ناسيًا أو جاهلًا",a:"لا إثم على من فعل محظورًا ناسيًا أو جاهلًا. وفي لزوم الفدية خلاف وتفصيل بحسب المحظور، فاسأل مرشدًا موثوقًا."},
{q:"حككت رأسي فسقطت شعرة دون قصد",a:"لا شيء عليك. المحظور هو أن تقصد إزالة الشعر. فاحك برفق حتى لا تتساقط الشعرات."}
]
}
],
reminder:"قال الله تعالى: «وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ» (البقرة: 196).",
source:"القرآن الكريم: سورة البقرة، الآية 196. وتفاصيل الإحرام في كتب السنة والفقه.",
checks:[

{
title:"3. دخول المسجد الحرام",
intro:"بعد وصولك مكة تتجه إلى المسجد الحرام وأنت ما زلت محرمًا وملبيًا. الفقرات التالية مرتبة من لحظة وصولك حتى بداية الطواف.",
sections:[
{
title:"قبل الدخول",
p:[

],
boxes:[

],

},

boxes:[

{
title:"4. الطواف حول الكعبة",
intro:"الطواف: أن تدور حول الكعبة سبع مرات متتابعة. كل دورة تسمى «شوطًا»، تبدأها من الحجر الأسود وتنتهي عنده. اتبع الفقرات بالترتيب.",
sections:[
{
title:"قبل أن تبدأ",
steps:[
"توضأ وتأكد من ستر عورتك. فالطهارة شرط للطواف عند جمهور العلماء.",
"اتجه إلى جهة الحجر الأسود. ستجد علامة خضراء (إضاءة خضراء) تدلك على محاذاة الحجر الأسود.",
"للرجل: قبل أن تبدأ، اجعل وسط الرداء تحت إبطك الأيمن وأطرافه على كتفك الأيسر، فيصير كتفك الأيمن مكشوفًا. وهذا اسمه «الاضطباع»."
],
boxes:[
{kind:"sun",title:"سنة للرجل فقط",items:[
"الاضطباع (كشف الكتف الأيمن) أثناء هذا الطواف فقط. وبعد انتهاء الطواف غطِّ كتفك.",
"المرأة لا تضطبع."
]}
],
faq:[
{q:"انتقض وضوئي أثناء الطواف",a:"الجمهور على اشتراط الطهارة للطواف، فالأحوط أن تتوضأ ثم تكمل ما بقي. وفي إعادة الشوط خلاف بين الفقهاء؛ اسأل مرشدًا موثوقًا."}
]
},
{
title:"نقطة البداية: الحجر الأسود",
steps:[
"قف مقابلًا للحجر الأسود عند العلامة الخضراء.",
"إن تيسر دون زحام فامسحه بيدك وقبّله.",
"وإن لم يتيسر فأشر إليه بيدك اليمنى من بعيد وقل «الله أكبر». وهذا يكفي ولا شيء عليك.",
"ثم اجعل الكعبة عن يسارك وابدأ المشي. وهذا هو بداية الشوط الأول."
],
duas:[
{title:"عند محاذاة الحجر الأسود",text:"اللَّهُ أَكْبَرُ.",meaning:"يكبر عند محاذاة الحجر الأسود في بداية كل شوط. لا يلزم الوصول إليه أو لمسه."}
],
boxes:[
{kind:"ok",title:"حلال",items:[
"تقبيل الحجر الأسود ومسحه إن تيسر دون مزاحمة أو أذى.",

"تفويت التقبيل والاكتفاء بالإشارة إن كان الزحام شديدًا."
]},
{kind:"no",title:"حرام",items:[

"اعتقاد أن الحجر ينفع أو يضر بذاته. إنما نقبله اتباعًا للنبي ﷺ."
]}
]
},
{
title:"أثناء الأشواط السبعة",
p:[
"امش حول الكعبة عكس عقارب الساعة، والكعبة عن يسارك دائمًا.",

],
boxes:[
{kind:"sun",title:"سنة للرجل فقط",items:[
"الرَّمَل في الأشواط الثلاثة الأولى: أن تسرع في المشي بخطوات متقاربة، إن تيسر دون إيذاء أحد. وفي الأربعة الباقية تمشي مشيًا عاديًا.",
"المرأة لا ترمل."
]},
{kind:"sun",title:"سنة",items:[
"لمس الركن اليماني بيدك إن تيسر دون زحام، دون تقبيل ودون إشارة. وإن لم تستطع فامضِ ولا تشر إليه."
]}
],
duas:[
{title:"بين الركن اليماني والحجر الأسود",text:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً، وَفِي الْآخِرَةِ حَسَنَةً، وَقِنَا عَذَابَ النَّارِ.",meaning:"دعاء وارد في هذا الموضع."},
{title:"أذكار عامة",text:"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ.\nأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ.",meaning:"اذكر الله وادعه بما تيسر؛ لا يوجد دعاء مخصوص ثابت لكل شوط."}
],
boxes:[
{kind:"ok",title:"حلال أثناء الطواف",items:[
"الكلام اليسير وسؤال من يساعدك.",
"شرب الماء ومنه ماء زمزم المتاح.",
"قراءة القرآن، والدعاء بأي لغة وأي دعاء.",
"استخدام كتاب أدعية أو الهاتف للأذكار.",
"الراحة اليسيرة ثم إكمال الطواف من مكانك.",
"الطواف في أي طابق: الأرضي أو الأول أو السطح.",
"الطواف على كرسي متحرك أو محمولًا للعاجز."
]},
{kind:"no",title:"حرام أثناء الطواف",items:[
"الطواف من داخل الحِجر، فلا يُحسب ذلك الشوط.",
"تقبيل أو مسح الركن الشامي والغربي وجدران الكعبة والمقام، فلم يشرع ذلك.",

"دفع الناس والزحام المؤذي.",

]}
],
faq:[
{q:"شككت في عدد الأشواط",a:"ابنِ على الأقل المتيقن وأكمل حتى تبلغ سبعة. اضغط العداد مع نهاية كل شوط حتى لا تنسى."},
{q:"أقيمت الصلاة وأنا أطوف",a:"اقطع الطواف وصلِّ مع الجماعة، ثم أكمل من الموضع الذي وقفت عنده."},
{q:"لا أستطيع المشي",a:"يجوز للعاجز أو المريض الطواف على كرسي متحرك أو محمولًا. التزم المسار المخصص ولا تؤذِ الناس."},
{q:"حاضت المرأة أثناء الطواف",a:"تخرج من المطاف ولا تكمل حتى تطهر. اسألي مرشدًا هل تكملين أو تعيدين بحسب حالك."}
]
},
{

reminder:"قال الله تعالى: «فَإِذَا فَرَغْتَ فَانْصَبْ ۝ وَإِلَىٰ رَبِّكَ فَارْغَبْ» (الشرح: 7-8).",
source:"القرآن الكريم: سورة الشرح، الآيتان 7-8.",
checks:[
"أكملت سبعة أشواط في الطواف.",
"أكملت سبعة أشواط في السعي.",
"أتممت الحلق أو التقصير.",
"أتحقق من اكتمال النسك وأحمد الله على التيسير.",
"أعزم على المحافظة على الصلاة والعمل الصالح."
]
}
];

const nav = document.getElementById("stageNav");
const content = document.getElementById("content");
const toastEl = document.getElementById("toast");
const overlay = document.getElementById("overlay");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const barStatus = document.getElementById("barStatus");

let current = 0;
let completed = new Set();
let counts = {tawaf:0, sai:0};
let reviewing = false;
let activeUpdateGate = null;
let toastTimer = null;

/* ---------- التخزين ---------- */
function safeRead(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (_) { return fallback; }
}
function safeWrite(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (_) { return false; }
}
function checkKey(s, c) { return STORAGE.checkPrefix + s + "-" + c; }
function isChecked(s, c) {
  try { return localStorage.getItem(checkKey(s, c)) === "1"; }
  catch (_) { return false; }
}
function setChecked(s, c, checked) {
  try {
    if (checked) localStorage.setItem(checkKey(s, c), "1");
    else localStorage.removeItem(checkKey(s, c));
  } catch (_) {}
}
function clampCount(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(7, Math.floor(n)));
}
function saveState() {
  safeWrite(STORAGE.done, [...completed]);
  safeWrite(STORAGE.counts, counts);
  safeWrite(STORAGE.cur, current);
}
function firstIncomplete() {
  for (let i = 0; i < stages.length; i++) if (!completed.has(i)) return i;
  return stages.length - 1;
}
function loadState() {
  const savedDone = safeRead(STORAGE.done, []);
  const savedCounts = safeRead(STORAGE.counts, {});
  const savedCur = safeRead(STORAGE.cur, 0);

  if (Array.isArray(savedDone)) {
    completed = new Set(savedDone.filter(n => Number.isInteger(n) && n >= 0 && n < stages.length));
  }
  if (savedCounts && typeof savedCounts === "object") {
    counts.tawaf = clampCount(savedCounts.tawaf);
    counts.sai = clampCount(savedCounts.sai);
  }
  // لا نسمح بحالة محفوظة تتجاوز مرحلة غير مكتملة.
  for (let i = 0; i < stages.length; i++) {
    if (!completed.has(i)) {
      for (let j = i + 1; j < stages.length; j++) completed.delete(j);
      break;
    }
  }
  // العدادان شرط لاعتماد مرحلتي الطواف والسعي.
  if (completed.has(3) && counts.tawaf !== 7) invalidateFrom(3, false);
  if (completed.has(5) && counts.sai !== 7) invalidateFrom(5, false);

  current = Number.isInteger(savedCur) && savedCur >= 0 && savedCur < stages.length ? savedCur : 0;
  if (!canAccess(current)) current = firstIncomplete();
}

/* ---------- أدوات ---------- */
function toast(message) {
  toastEl.textContent = message;
  toastEl.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, 2600);
}
function buzz(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms || 15); } catch (_) {}
}
function invalidateFrom(stageIndex, save = true) {
  for (let i = stageIndex; i < stages.length; i++) completed.delete(i);
  if (save) saveState();
  updateProgress();
}
function checklistDone(i) {
  return stages[i].checks.every((_, c) => isChecked(i, c));
}
function allChecksDone(i) {
  if (!checklistDone(i)) return false;
  const st = stages[i];
  if (st.counter && counts[st.counter] !== 7) return false;
  return true;
}
function canAccess(index) {
  if (index === 0) return true;
  for (let i = 0; i < index; i++) if (!completed.has(i)) return false;
  return true;
}
function updateProgress() {
  const n = completed.size;
  const pct = Math.round(n / stages.length * 100);
  document.getElementById("progressText").textContent = `أنجزت ${n} من ${stages.length} مراحل`;
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";
}

/* ---------- لوحة المراحل ---------- */
function openSheet() { buildNav(); overlay.classList.add("open"); }
function closeSheet() { overlay.classList.remove("open"); }
overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closeNotes(); } });
document.getElementById("menuBtn").onclick = openSheet;
document.getElementById("closeSheet").onclick = closeSheet;

function buildNav() {
  nav.innerHTML = "";
  stages.forEach((stage, index) => {
    const allowed = reviewing || canAccess(index);
    const button = document.createElement("button");
    button.type = "button";
    button.className = (index === current && !isFinishScreen()) ? "active" : "";
    button.disabled = !allowed;
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = completed.has(index) ? "✓" : String(index + 1);
    const label = document.createElement("span");
    label.textContent = stage.title.replace(/^\d+\.\s*/, "");
    button.appendChild(num);
    button.appendChild(label);
    button.onclick = () => {
      if (!allowed) { toast("أكمل المراحل السابقة أولًا."); return; }
      current = index;
      saveState();
      closeSheet();
      render();
    };
    nav.appendChild(button);
  });
}
function isFinishScreen() {
  return completed.size === stages.length && !reviewing;
}

/* ---------- العداد ---------- */
function counterHtml(type) {
  const title = type === "tawaf" ? "عداد الطواف" : "عداد السعي";
  const desc = type === "tawaf"
    ? "الشوط يبدأ وينتهي بمحاذاة الحجر الأسود."
    : "الذهاب من الصفا إلى المروة شوط، والعودة شوط آخر.";
  return `
    <div class="counter">
      <strong>${title}</strong>
      <button type="button" class="tap" id="${type}Tap" aria-label="إضافة شوط">
        <span class="n" id="${type}Count">${counts[type]}</span>
        <span class="l">من 7 • اضغط لإضافة شوط</span>
      </button>
      <div class="counter-controls">
        <button type="button" id="${type}Minus" aria-label="إنقاص شوط">−</button>
        <button type="button" class="reset" id="${type}Reset">إعادة العداد</button>
      </div>
      <div class="counter-help">${desc}</div>
      <div class="counter-help">العداد للتذكير فقط؛ تأكد من الأشواط التي أديتها فعلًا.</div>
      <div class="counter-help">تبقى الشاشة مضاءة أثناء العدّ إن كان جهازك يدعم ذلك.</div>
    </div>`;
}
function stageIndexForCounter(type) { return type === "tawaf" ? 3 : 5; }

function bindCounter(type) {
  const number = document.getElementById(type + "Count");
  const tap = document.getElementById(type + "Tap");
  const minus = document.getElementById(type + "Minus");
  const reset = document.getElementById(type + "Reset");

  function set(value) {
    const nextValue = clampCount(value);
    if (nextValue !== counts[type]) {
      counts[type] = nextValue;
      invalidateFrom(stageIndexForCounter(type), false);
      saveState();
      updateProgress();
    }
    number.textContent = String(counts[type]);
    minus.disabled = counts[type] === 0;
    tap.disabled = counts[type] === 7;
    if (typeof activeUpdateGate === "function") activeUpdateGate();
  }
  tap.onclick = () => {
    if (counts[type] < 7) { buzz(18); set(counts[type] + 1); if (counts[type] === 7) buzz([30,40,30]); }
  };
  minus.onclick = () => { if (counts[type] > 0) set(counts[type] - 1); };
  reset.onclick = () => {
    if (counts[type] === 0) return;
    if (confirm("هل تريد إعادة العداد إلى صفر؟")) set(0);
  };
  set(counts[type]);
}

/* ---------- النسخ ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      toast("تم نسخ الذكر.");
      return;
    }
  } catch (_) {}
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.cssText = "position:fixed;opacity:0;top:0;left:0;font-size:16px";
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  area.remove();
  toast(ok ? "تم نسخ الذكر." : "تعذر النسخ تلقائيًا؛ اضغط مطولًا على النص لنسخه.");
}

/* ---------- بناء الفقرات ---------- */
const BOX_DEFAULT = {ok:"حلال (يجوز)", no:"حرام (لا يجوز)", sun:"سنة (مستحبة وليست واجبة)"};
const BOX_ICON = {ok:"✅", no:"❌", sun:"⭐"};

function liHtml(items) { return items.map(i => `<li>${i}</li>`).join(""); }
function boxTitle(b) { return `${BOX_ICON[b.kind]} ${b.title || BOX_DEFAULT[b.kind]}`; }

function sectionHtml(sec, si) {
  let h = `<section class="sec"><div class="sec-head"><span class="sec-num">${si + 1}</span><h3>${sec.title}</h3></div>`;
  (sec.p || []).forEach(t => { h += `<p>${t}</p>`; });
  if (sec.steps) h += `<ol class="steps">${liHtml(sec.steps)}</ol>`;
  (sec.duas || []).forEach((d, di) => {
    h += `<div class="dua"><div class="dua-label">${d.title}</div><div class="arabic">${d.text}</div>` +
         (d.meaning ? `<div class="meaning">${d.meaning}</div>` : "") +
         `<button type="button" class="mini-btn copy-btn" data-s="${si}" data-d="${di}">نسخ الذكر</button></div>`;
  });
  (sec.boxes || []).forEach(b => {
    h += `<div class="box ${b.kind}"><b>${boxTitle(b)}</b><ul>${liHtml(b.items)}</ul></div>`;
  });
  if (sec.note) h += `<div class="warn">${sec.note}</div>`;
  if (sec.faq && sec.faq.length) {
    h += `<div class="faqhead">أسئلة شائعة في هذه الخطوة</div>` +
      sec.faq.map(f => `<details class="faq"><summary>${f.q}</summary><div class="ans">${f.a}</div></details>`).join("");
  }
  return h + `</section>`;
}

/* ---------- PDF (عبر الطباعة: حفظ كـ PDF) ---------- */
function printSection(sec, si) {
  let h = `<h3>${si + 1}. ${sec.title}</h3>`;
  (sec.p || []).forEach(t => { h += `<p>${t}</p>`; });
  if (sec.steps) h += `<ol>${liHtml(sec.steps)}</ol>`;
  (sec.duas || []).forEach(d => {
    h += `<div class="pdua"><b>${d.title}</b><div class="parabic">${d.text}</div>${d.meaning ? `<div class="psrc">${d.meaning}</div>` : ""}</div>`;
  });
  (sec.boxes || []).forEach(b => {
    h += `<div class="pbox ${b.kind}"><b>${boxTitle(b)}</b><ul>${liHtml(b.items)}</ul></div>`;
  });
  if (sec.note) h += `<div class="pwarn">${sec.note}</div>`;
  (sec.faq || []).forEach(f => {
    h += `<div class="pdua"><b>س: ${f.q}</b><div>${f.a}</div></div>`;
  });
  return h;
}
function buildPrintArea() {
  const pa = document.getElementById("printArea");
  let html = `<h1>رفيق العمرة</h1><div class="sub">دليل المناسك والأذكار خطوة بخطوة</div>`;
  stages.forEach(st => {
    html += `<section class="stage"><h2>${st.title}</h2><p>${st.intro}</p>`;
    html += st.sections.map(printSection).join("");
    html += `<div class="prem">${st.reminder}<div class="psrc">${st.source}</div></div></section>`;
  });
  html += `<div class="pfoot">اللهم تقبل عمرتنا واغفر لنا وارحمنا.<br>ونرجو الدعاء لمن أعدّ هذا الدليل.</div>`;
  pa.innerHTML = html;
}
function savePdf() {
  closeSheet();
  buildPrintArea();
  toast("اختر «حفظ كـ PDF» من نافذة الطباعة.");
  setTimeout(() => {
    try { window.print(); }
    catch (_) { toast("المتصفح لا يدعم الطباعة هنا. افتح الصفحة في Safari أو Chrome."); }
  }, 350);
}
document.getElementById("pdfBtn").onclick = savePdf;

/* ---------- شاشة الاكتمال ---------- */
function renderCompletion() {
  activeUpdateGate = null;
  manageWakeLock(false);
  document.body.classList.add("no-bar");

  content.innerHTML = `
    <section class="finish">
      <div class="finish-symbol" aria-hidden="true">✓</div>
      <h2>مبارك عليك إتمام العمرة</h2>
      <div class="blessing">تَقَبَّلَ اللَّهُ مِنْكَ، وَغَفَرَ ذَنْبَكَ،<br>وَجَعَلَهَا عُمْرَةً مَبْرُورَةً وَسَعْيًا مَشْكُورًا</div>
      <p>أتممت مراحل دليل رفيق العمرة. نسأل الله أن يتقبل طاعتك ويرزقك الأجر والقبول، وأن يجعل ما أديته في ميزان حسناتك.</p>

      <div class="dua-request">
        <b>رسالة صغيرة:</b>
        <p style="margin-bottom:0">إن نفعك هذا الدليل، فنرجو منك دعوة صادقة في ظهر الغيب لمن قام بهذا المشروع، بالمغفرة والرحمة والقبول وحسن الخاتمة، ولوالديه وللمسلمين أجمعين. جزاك الله خيرًا.</p>
      </div>

      <div class="reminder" style="text-align:right">
        <strong>تذكير</strong>
        <p style="margin-bottom:0">إكمال الدليل لا يغني عن التأكد من أداء المناسك فعليًا. إذا شككت في حكم أو عدد شوط، اسأل مرشدًا موثوقًا.</p>
      </div>

      <div class="finish-actions">
        <button type="button" class="primary-btn" id="finPdf">📄 حفظ الدليل PDF</button>
        <button type="button" class="secondary-btn" id="reviewStart">مراجعة المناسك من البداية</button>
        <button type="button" class="secondary-btn" id="reviewLast">عرض المرحلة الأخيرة</button>
        <button type="button" class="secondary-btn danger" id="newUmrah">بدء عمرة جديدة</button>
      </div>
    </section>`;

  document.getElementById("finPdf").onclick = savePdf;
  document.getElementById("reviewStart").onclick = () => { reviewing = true; current = 0; render(); };
  document.getElementById("reviewLast").onclick = () => { reviewing = true; current = stages.length - 1; render(); };
  document.getElementById("newUmrah").onclick = () => resetAll(true);

  updateProgress();
  window.scrollTo(0, 0);
}

/* ---------- العرض ---------- */
function render() {
  if (isFinishScreen()) { renderCompletion(); return; }

  document.body.classList.remove("no-bar");
  if (!reviewing && !canAccess(current)) current = firstIncomplete();
  saveState();

  const stage = stages[current];
  const isLast = current === stages.length - 1;
  manageWakeLock(!reviewing && !!stage.counter);

  content.innerHTML = `
    <div class="stage-meta">
      <span>المرحلة ${current + 1} من ${stages.length}</span>
      <span id="stageState">${reviewing ? "وضع المراجعة" : (completed.has(current) ? "✓ مكتملة" : "قيد التنفيذ")}</span>
    </div>

    ${reviewing ? '<div class="review-banner">أنت في وضع المراجعة. تنقل بين المراحل بحرية.</div>' : ""}

    <h2>${stage.title}</h2>
    <p class="intro">${stage.intro}</p>

    ${stage.sections.map(sectionHtml).join("")}

    <div class="reminder">
      <strong>تذكير من القرآن أو السنة</strong>
      <p>${stage.reminder}</p>
      <div class="source">${stage.source}</div>
    </div>

    ${(!reviewing && stage.counter) ? counterHtml(stage.counter) : ""}

    ${reviewing ? "" : `
    <div class="check-area">
      <h3 style="margin-top:0">قائمة التحقق قبل الانتقال</h3>
      <p style="font-size:.9rem;color:var(--muted)">علّم على كل بند بعد إتمامه. في الطواف والسعي، راجع العدد الفعلي أيضًا.</p>
      <div id="checklist"></div>
    </div>`}`;

  /* أزرار نسخ الأذكار */
  content.querySelectorAll(".copy-btn").forEach(btn => {
    btn.onclick = () => copyText(stage.sections[+btn.dataset.s].duas[+btn.dataset.d].text);
  });

  /* الشريط السفلي */
  prevBtn.disabled = current === 0;
  prevBtn.onclick = () => {
    if (current > 0) { current--; render(); }
  };

  if (reviewing) {
    activeUpdateGate = null;
    barStatus.textContent = "وضع المراجعة";
    barStatus.className = "bar-status";
    nextBtn.disabled = false;
    nextBtn.textContent = isLast ? "شاشة التهنئة ✓" : "التالي ←";
    nextBtn.onclick = () => {
      if (isLast) { reviewing = false; render(); }
      else { current++; render(); }
    };
    updateProgress();
    window.scrollTo(0, 0);
    return;
  }

  /* قائمة التحقق */
  const checklist = document.getElementById("checklist");
  stage.checks.forEach((item, index) => {
    const label = document.createElement("label");
    label.className = "check-row";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = isChecked(current, index);
    const span = document.createElement("span");
    span.textContent = item;
    if (input.checked) label.classList.add("done");

    input.onchange = () => {
      setChecked(current, index, input.checked);
      label.classList.toggle("done", input.checked);
      buzz(10);
      // نلغي الاعتماد فقط إذا صارت المرحلة ناقصة بعد التعديل.
      if (!allChecksDone(current)) invalidateFrom(current);
      updateGate();
    };
    label.appendChild(input);
    label.appendChild(span);
    checklist.appendChild(label);
  });

  if (stage.counter) bindCounter(stage.counter);

  function updateGate() {
    const done = allChecksDone(current);
    const remainingChecks = stage.checks.filter((_, i) => !isChecked(current, i)).length;
    const counterPending = stage.counter && counts[stage.counter] !== 7;

    nextBtn.disabled = !done;
    nextBtn.textContent = isLast ? "إكمال العمرة ✓" : "التالي ←";

    if (done) {
      barStatus.textContent = "اكتملت المتطلبات ✓ راجع ما أديته فعلًا ثم تابع";
      barStatus.className = "bar-status ok";
    } else if (counterPending && remainingChecks === 0) {
      barStatus.textContent = `العداد ${counts[stage.counter]} من 7 — أكمل الأشواط`;
      barStatus.className = "bar-status";
    } else {
      barStatus.textContent = `بقي ${remainingChecks} من بنود التحقق` + (counterPending ? ` + العداد (${counts[stage.counter]}/7)` : "");
      barStatus.className = "bar-status";
    }
    const st = document.getElementById("stageState");
    if (st) st.textContent = completed.has(current) ? "✓ مكتملة" : "قيد التنفيذ";
  }
  activeUpdateGate = updateGate;
  updateGate();

  nextBtn.onclick = () => {
    if (!allChecksDone(current)) { toast("أكمل قائمة التحقق والعداد المطلوب أولًا."); updateGate(); return; }
    completed.add(current);
    buzz(25);
    if (current < stages.length - 1) {
      current++;
      saveState();
      updateProgress();
      render();
    } else {
      saveState();
      updateProgress();
      renderCompletion();
    }
  };

  updateProgress();
  window.scrollTo(0, 0);
}

/* ---------- إعادة الضبط ---------- */
function resetAll(fromFinish) {
  const msg = fromFinish
    ? "سيتم مسح التقدم وقوائم التحقق والعدادات لبدء عمرة جديدة. متابعة؟"
    : "هل تريد مسح كل التقدم وقوائم التحقق والعدادات؟";
  if (!confirm(msg)) return;

  completed.clear();
  counts = {tawaf:0, sai:0};
  current = 0;
  reviewing = false;
  activeUpdateGate = null;
  closeSheet();

  try {
    localStorage.removeItem(STORAGE.done);
    localStorage.removeItem(STORAGE.counts);
    localStorage.removeItem(STORAGE.cur);
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(STORAGE.checkPrefix)) keys.push(key);
    }
    keys.forEach(k => localStorage.removeItem(k));
  } catch (_) {}

  render();
  toast("تمت إعادة الضبط.");
}
document.getElementById("resetAll").onclick = () => resetAll(false);

/* ---------- إبقاء الشاشة مضاءة أثناء الطواف والسعي ---------- */
let wakeLock = null;
let wantWake = false;
async function manageWakeLock(want) {
  wantWake = want;
  try {
    if (want) {
      if (!("wakeLock" in navigator) || wakeLock) return;
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (_) { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && wantWake) manageWakeLock(true);
});

/* ---------- حجم الخط ---------- */
const SCALES = [0.9, 1, 1.15, 1.3, 1.5];
let scaleIdx = 1;
function applyScale() {
  document.documentElement.style.fontSize = (16 * SCALES[scaleIdx]) + "px";
  document.getElementById("fontMinus").disabled = scaleIdx === 0;
  document.getElementById("fontPlus").disabled = scaleIdx === SCALES.length - 1;
}
(function () {
  const s = safeRead(STORAGE.scale, 1);
  scaleIdx = Number.isInteger(s) && s >= 0 && s < SCALES.length ? s : 1;
  applyScale();
})();
document.getElementById("fontMinus").onclick = () => {
  if (scaleIdx > 0) { scaleIdx--; safeWrite(STORAGE.scale, scaleIdx); applyScale(); }
};
document.getElementById("fontPlus").onclick = () => {
  if (scaleIdx < SCALES.length - 1) { scaleIdx++; safeWrite(STORAGE.scale, scaleIdx); applyScale(); }
};

/* ---------- دفتر أدعيتي ---------- */
const notesOverlay = document.getElementById("notesOverlay");
const notesText = document.getElementById("notesText");
function closeNotes() { notesOverlay.classList.remove("open"); }
(function () {
  const saved = safeRead(STORAGE.notes, "");
  notesText.value = typeof saved === "string" ? saved : "";
})();
notesText.addEventListener("input", () => safeWrite(STORAGE.notes, notesText.value));
document.getElementById("notesBtn").onclick = () => {
  closeSheet();
  notesOverlay.classList.add("open");
};
document.getElementById("closeNotes").onclick = closeNotes;
notesOverlay.addEventListener("click", e => { if (e.target === notesOverlay) closeNotes(); });
document.getElementById("copyNotes").onclick = async () => {
  const t = notesText.value;
  if (!t.trim()) { toast("لا يوجد نص للنسخ."); return; }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(t);
      toast("تم نسخ الدفتر.");
      return;
    }
  } catch (_) {}
  notesText.select();
  notesText.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  toast(ok ? "تم نسخ الدفتر." : "تعذر النسخ تلقائيًا.");
};

loadState();
render();
</script>
</body>
</html>
